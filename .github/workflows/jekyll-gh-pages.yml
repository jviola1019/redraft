name: Publish REDRAFT GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Build the Pages directory with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_jekyll
      - name: Assemble and validate the upload
        run: python3 .github/scripts/verify-pages.py _jekyll _site
      - name: Check desktop and phone widths
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-test" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          chrome=$(command -v google-chrome)
          NODE_PATH="$RUNNER_TEMP/pages-test/node_modules" node .github/scripts/smoke-pages.cjs _site "$chrome"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
